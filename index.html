<!DOCTYPE html>
<html>
  
<style>
@keyframes carFly {
  from { right: -120px; }
  to { right: calc(100% + 120px); }
}

#racecar {
  position: fixed;
  top: 80%;
  right: -190px;
  font-size: 35px;
}

#racecar.fly {
  animation: carFly 10s linear forwards;
  animation-fill-mode: forwards;
  visibility: visible;
}
</style>



<style>
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url("mclaren-p1.webp");
  background-size: cover;
  background-position: center;
  opacity: 0.2;
  pointer-events: none;
  z-index: 0;
}

body > *:not(#racecar) {
  position: relative;
  z-index: 1;
}

#racecar {
  z-index: 2;
}
</style>


  <head>
  <title>hello ashley</title>
</head>
<body style="background-color: #171717; color: white;"></html>
  <h1>Welcome, Ashley.</h1>
<button onclick="alert('Greetings Ash.')">Click right here please</button>
  <img src="mclaren-p1.webp" width="500">
  <p>This is jordan. Enjoy working today.</p>

<button onclick="launchCar()">LAUNCH CAR! 🏎️</button>

<div id="racecar">    🏎️💨      
  
  🚓 🚓</div>

<script>
function launchCar() {
  const car = document.getElementById("racecar");
  car.classList.remove("fly");
  void car.offsetWidth;
  car.classList.add("fly");
}
</script>

</body>
</html>
